{% set name = "geoip2" %}
{% set version = "4.8.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 9aea2eab4b3e6252f47456528ae9c35b104c45277639c13fce1be87c92f84257

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.7
    - pip
  run:
    - python >=3.7
    - aiohttp >=3.6.2,<4.0.0
    - maxminddb >=2.3.0,<3.0.0
    - requests >=2.24.0,<3.0.0

test:
  imports:
    - geoip2

about:
  home: https://pypi.org/project/geoip2/#description
  dev_url: https://github.com/maxmind/GeoIP2-python
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  license_url: https://opensource.org/license/apache-2-0/
  summary: IP address geolocation library for Maxmind DBs

extra:
  recipe-maintainers:
    - rverma129
